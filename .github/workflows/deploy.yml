name: CD - Deploy to Home Server

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - "Makefile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy_on_home_server:
    runs-on: self-hosted
    steps:
      - name: Deploy with Docker Compose
        run: |
          cd /srv/apps/zatyshok/Zatyshok
          git pull origin main
          make prod-build
          make prod-up
          docker image prune -f
