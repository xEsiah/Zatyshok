name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
    steps:
      - name: Check GITEA_TOKEN is configured
        if: env.GITEA_TOKEN == ''
        run: |
          echo "::error::Secret GITEA_TOKEN is missing. Create an access token on Gitea (Settings > Applications, repository write scope) and add it as the GITEA_TOKEN repository secret on GitHub before tagging a release. Without it, new builds would point to a non-existent update feed and updated clients would never receive future updates."
          exit 1
      - name: Validate GITEA_TOKEN
        if: env.GITEA_TOKEN != ''
        run: |
          LOGIN=$(curl -fsS -H "Authorization: token $GITEA_TOKEN" https://git.cohaise.dev/api/v1/user | jq -r '.login // empty')
          if [ -z "$LOGIN" ]; then
            echo "::error::GITEA_TOKEN is invalid or Gitea is unreachable."
            exit 1
          fi
          echo "Authenticated on Gitea as $LOGIN."

  release:
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          overwrite: true
          path: |
            frontend/dist/*.exe
            frontend/dist/*.blockmap
            frontend/dist/*.AppImage
            frontend/dist/*.rpm
            frontend/dist/*.deb
            frontend/dist/*.dmg
            frontend/dist/*.zip
            frontend/dist/latest*.yml
          if-no-files-found: warn
          retention-days: 1

  publish-gitea:
    needs: release
    runs-on: ubuntu-latest
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      GITEA_SERVER: https://git.cohaise.dev
      GITEA_OWNER: Esiah
      GITEA_REPO: Zatyshok
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true

      - name: Publish release assets and update feed to Gitea
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          API="$GITEA_SERVER/api/v1/repos/$GITEA_OWNER/$GITEA_REPO"
          AUTH="Authorization: token $GITEA_TOKEN"
          BRANCH="update-feed"
          FEED_BASE="$GITEA_SERVER/$GITEA_OWNER/$GITEA_REPO/releases/download/$TAG"
          PAGE_BASE="$GITEA_SERVER/$GITEA_OWNER/$GITEA_REPO"

          REL_ID=$(curl -fsS "$API/releases/tags/$TAG" -H "$AUTH" | jq -r '.id // empty' || true)
          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -fsS -X POST "$API/releases" -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"target_commitish\":\"main\"}" | jq -r '.id // empty' || true)
          fi
          if [ -z "$REL_ID" ]; then
            echo "::error::Cannot create the Gitea release for $TAG. Make sure the tag is pushed to $GITEA_SERVER/$GITEA_OWNER/$GITEA_REPO first."
            exit 1
          fi
          echo "Gitea release id: $REL_ID"

          for f in *.exe *.blockmap *.AppImage *.rpm *.deb *.dmg *.zip; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f")
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              "$API/releases/$REL_ID/assets?name=$NAME" -H "$AUTH" -F "attachment=@$f")
            if [ "$CODE" != "201" ]; then
              EXISTS=$(curl -fsS "$API/releases/$REL_ID/assets" -H "$AUTH" \
                | jq -r --arg n "$NAME" '[.[] | select(.name == $n)] | length')
              if [ "$EXISTS" != "1" ]; then
                echo "::error::Upload of $NAME failed (HTTP $CODE)."
                exit 1
              fi
            fi
            echo "asset $NAME -> $CODE"
          done

          curl -sS -o /dev/null -X POST "$API/branches" -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"name\":\"$BRANCH\",\"old_branch\":\"main\"}" || true

          for yml in latest.yml latest-mac.yml latest-linux.yml; do
            [ -f "$yml" ] || continue
            sed -i.bak "s#\(url: \)#\1$FEED_BASE/#" "$yml" && rm -f "$yml.bak"
            SHA=$(curl -fsS "$API/contents/$yml?ref=$BRANCH" -H "$AUTH" | jq -r '.sha // empty' || true)
            B64=$(base64 < "$yml" | tr -d '\n')
            BODY=$(jq -n --arg msg "feed: $TAG $yml" --arg c "$B64" --arg b "$BRANCH" --arg s "${SHA:-}" \
              '{message:$msg, content:$c, branch:$b} + (if $s == "" then {} else {sha:$s} end)')
            if [ -z "$SHA" ]; then METHOD=POST; else METHOD=PUT; fi
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X "$METHOD" "$API/contents/$yml" \
              -H "$AUTH" -H "Content-Type: application/json" -d "$BODY")
            case "$CODE" in
              200|201) echo "$yml published on $BRANCH" ;;
              *) echo "::error::Writing $yml to branch $BRANCH failed (HTTP $CODE)."; exit 1 ;;
            esac
          done

      - name: Verify update feed is live
        run: |
          set -euo pipefail
          BRANCH="update-feed"
          for yml in latest.yml latest-mac.yml latest-linux.yml; do
            curl -fsSL -o /dev/null "$GITEA_SERVER/$GITEA_OWNER/$GITEA_REPO/raw/branch/$BRANCH/$yml"
            echo "$yml reachable on $BRANCH"
          done
